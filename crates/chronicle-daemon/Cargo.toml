[package]
name = "chronicle-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
chronicle-core = { path = "../chronicle-core" }
chronicle-config = { path = "../chronicle-config" }
chronicle-hooks = { path = "../chronicle-hooks" }
chronicle-plugin = { path = "../chronicle-plugin" }
chronicle-ipc = { path = "../chronicle-ipc" }
chronicle-store = { path = "../chronicle-store" }
chronicle-ai = { path = "../chronicle-ai" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
notify = { version = "8", features = ["macos_fsevent"] }
url = "2"
chrono = { workspace = true }
uuid = { workspace = true }
shellexpand = "3"
dirs = "6"
libc = "0.2"
axum = { version = "0.8", features = ["json"] }
tower-http = { version = "0.6", features = ["cors"] }
