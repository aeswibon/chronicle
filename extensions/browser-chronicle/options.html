<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Chronicle browser extension</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 1.5rem; max-width: 32rem; }
      textarea { width: 100%; height: 8rem; font-family: monospace; }
      p { color: #555; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <h1>Chronicle</h1>
    <p>One domain per line. Empty list records all HTTP(S) tabs.</p>
    <textarea id="domains"></textarea>
    <p><button id="save">Save</button> <span id="status"></span></p>
    <script src="options.js"></script>
  </body>
</html>
