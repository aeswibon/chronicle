name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  tauri:
    name: Tauri bundle (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            arch: arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@v2

      - name: Install system deps
        run: |
          case "${{ matrix.target }}" in
            *linux*) sudo apt-get update && sudo apt-get install -y webkit2gtk-4.1 ;;
          esac

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: Build Tauri app
        run: bun run tauri build --target ${{ matrix.target }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}

      - name: Compute checksums
        run: |
          cd src-tauri/target/${{ matrix.target }}/release/bundle/dmg
          shasum -a 256 *.dmg > checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: chronicle-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*

  release:
    name: Create release
    needs: [tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: chronicle-*
          merge-multiple: true

      - name: Generate release notes
        run: |
          echo "## Chronicle v${GITHUB_REF_NAME#v}" > release-notes.md
          echo "" >> release-notes.md
          echo "### Downloads" >> release-notes.md
          for f in *.dmg; do
            echo "- [$f](https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/$f)" >> release-notes.md
          done

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            *.dmg
            *.txt
