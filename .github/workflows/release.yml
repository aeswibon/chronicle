name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  tauri:
    name: Tauri bundle (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            arch: arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@v2

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: Build Tauri app
        run: bun run tauri build --target ${{ matrix.target }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}

      - name: Rename DMG for release
        run: |
          cd "src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          dmg=( *.dmg )
          if [ ! -f "${dmg[0]}" ]; then
            echo "No DMG found" >&2
            exit 1
          fi
          cp "${dmg[0]}" "chronicle-${{ matrix.arch }}.dmg"
          shasum -a 256 chronicle-${{ matrix.arch }}.dmg > checksums-${{ matrix.arch }}.txt
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: chronicle-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/chronicle-${{ matrix.arch }}.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/checksums-${{ matrix.arch }}.txt

  release:
    name: Create release
    needs: [tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: chronicle-*
          merge-multiple: true

      - name: Generate release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"

          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "No CHANGELOG section for version ${VERSION}" >&2
            exit 1
          fi

          {
            awk -v ver="${VERSION}" '
              $0 ~ "^## \\[" ver "\\]" { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md

            echo ""
            echo "### Install"
            echo "1. Download the DMG for your Mac (Apple Silicon → arm64, Intel → x64)"
            echo "2. Open **Chronicle.app** — the background service starts automatically"
            echo "3. Optional: Settings → Install shell hook for terminal capture"
            echo ""
            echo "### Downloads"
            for f in chronicle-*.dmg; do
              echo "- [$f](https://github.com/${{ github.repository }}/releases/download/${TAG}/$f)"
            done
            echo ""
            echo "### Checksums"
            for f in checksums-*.txt; do
              echo '```'
              cat "$f"
              echo '```'
            done
          } > release-notes.md

          echo "--- release-notes.md ---"
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            chronicle-*.dmg
            checksums-*.txt
