name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  tauri:
    name: Tauri bundle (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
            arch: arm64
          - target: x86_64-apple-darwin
            os: macos-15
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Remove untrusted Homebrew tap
        run: brew untap aws/tap 2>/dev/null || true

      - uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          target: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@v2.2.0

      - name: Import code signing certificate
        if: vars.MACOS_SIGNING_ENABLED == 'true'
        uses: apple-actions/import-codesign-certs@v7.0.0
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Verify signing identity
        if: vars.MACOS_SIGNING_ENABLED == 'true'
        run: security find-identity -v -p codesigning

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: Build unsigned Tauri app
        if: vars.MACOS_SIGNING_ENABLED != 'true'
        run: bun run tauri build --target ${{ matrix.target }}

      # Certificate is already in the CI keychain — do NOT pass APPLE_CERTIFICATE here.
      - name: Build, sign, and notarize Tauri app
        if: vars.MACOS_SIGNING_ENABLED == 'true'
        run: bun run tauri build --target ${{ matrix.target }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}

      - name: Rename DMG for release
        run: |
          cd "src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          dmg=( *.dmg )
          if [ ! -f "${dmg[0]}" ]; then
            echo "No DMG found" >&2
            exit 1
          fi
          cp "${dmg[0]}" "chronicle-${{ matrix.arch }}.dmg"
          shasum -a 256 chronicle-${{ matrix.arch }}.dmg > checksums-${{ matrix.arch }}.txt
          ls -la

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: chronicle-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/chronicle-${{ matrix.arch }}.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/checksums-${{ matrix.arch }}.txt

  release:
    name: Create release
    needs: [tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: chronicle-*
          merge-multiple: true

      - name: Generate release notes from CHANGELOG
        env:
          SIGNED: ${{ vars.MACOS_SIGNING_ENABLED }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"

          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "No CHANGELOG section for version ${VERSION}" >&2
            exit 1
          fi

          {
            awk -v ver="${VERSION}" '
              $0 ~ "^## \\[" ver "\\]" { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md

            echo ""
            echo "### Install"
            echo "1. Download the DMG for your Mac (Apple Silicon → **arm64**, Intel → **x64**)"
            echo "2. Open the DMG and drag **Chronicle** to Applications"
            echo ""
            echo "### Homebrew"
            echo '```bash'
            echo "brew tap aeswibon/chronicle https://github.com/${{ github.repository }}"
            echo "brew trust aeswibon/chronicle"
            echo "brew install --cask chronicle"
            echo '```'
            echo "_Cask checksums are updated automatically when this release is published._"

            if [ "$SIGNED" = "true" ]; then
              echo "3. Open **Chronicle.app** — signed and notarized; background service starts automatically"
              echo "4. Optional: Settings → Install shell hook for terminal capture"
            else
              echo ""
              echo "> **Unsigned build** — no Apple Developer ID. macOS Gatekeeper may block the first launch. This is expected; the app is not damaged."
              echo ""
              echo "3. **First launch only:** Right-click **Chronicle.app** in Applications → **Open** → confirm **Open**"
              echo "   Or run in Terminal:"
              echo '   ```bash'
              echo "   xattr -dr com.apple.quarantine /Applications/Chronicle.app"
              echo '   ```'
              echo "4. Chronicle starts the background service automatically"
              echo "5. Optional: Settings → Install shell hook for terminal capture"
              echo ""
              echo "To avoid Gatekeeper prompts entirely, [build from source](https://github.com/${{ github.repository }}#readme) or enable paid signing — see [docs/07-release-macos.md](https://github.com/${{ github.repository }}/blob/master/docs/07-release-macos.md)."
            fi

            echo ""
            echo "### Downloads"
            for f in chronicle-*.dmg; do
              echo "- [$f](https://github.com/${{ github.repository }}/releases/download/${TAG}/$f)"
            done
            echo ""
            echo "### Checksums"
            for f in checksums-*.txt; do
              echo '```'
              cat "$f"
              echo '```'
            done
          } > release-notes.md

          echo "--- release-notes.md ---"
          cat release-notes.md

      - uses: softprops/action-gh-release@v3.0.1
        with:
          body_path: release-notes.md
          files: |
            chronicle-*.dmg
            checksums-*.txt
          overwrite_files: true

      # Retagging reuses an existing release; force body refresh every time.
      - name: Apply release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --notes-file release-notes.md

  update-homebrew-cask:
    name: Update Homebrew cask
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: master
          fetch-depth: 0

      - name: Download published release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-checksums
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${{ github.repository }}" \
            --pattern "checksums-*.txt" \
            --dir release-checksums
          ls -la release-checksums

      - name: Update Casks/chronicle.rb checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/update-homebrew-cask.mjs \
            "$VERSION" \
            release-checksums/checksums-arm64.txt \
            release-checksums/checksums-x64.txt

      - name: Verify cask matches published DMGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-dmgs
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${{ github.repository }}" \
            --pattern "chronicle-*.dmg" \
            --dir release-dmgs
          ARM=$(cut -d' ' -f1 release-checksums/checksums-arm64.txt)
          X64=$(cut -d' ' -f1 release-checksums/checksums-x64.txt)
          test "$(shasum -a 256 release-dmgs/chronicle-arm64.dmg | awk '{print $1}')" = "$ARM"
          test "$(shasum -a 256 release-dmgs/chronicle-x64.dmg | awk '{print $1}')" = "$X64"
          grep -q "version \"${VERSION}\"" Casks/chronicle.rb
          grep -q "$ARM" Casks/chronicle.rb
          grep -q "$X64" Casks/chronicle.rb

      - name: Commit and push cask update
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin master
          git add Casks/chronicle.rb
          if git diff --staged --quiet; then
            echo "Cask already up to date for v${VERSION}"
            exit 0
          fi
          git commit -m "chore: update Homebrew cask checksums for v${VERSION}"
          git push origin HEAD:master

