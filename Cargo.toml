[workspace]
resolver = "2"
members = [
    "crates/chronicle-core",
    "crates/chronicle-config",
    "crates/chronicle-hooks",
    "crates/chronicle-ipc",
    "crates/chronicle-store",
    "crates/chronicle-daemon",
    "crates/chronicle-mcp",
    "crates/chronicle-plugin",
    "crates/chronicle-ai",
]
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.2"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
thiserror = "1"
anyhow = "1"
