[package]
name = "chronicle-ui"
version = "0.1.2"
description = "Chronicle - Developer Observability Platform"
authors = ["Aeswibon"]
edition = "2021"

[lib]
name = "chronicle_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
chronicle-core = { path = "../crates/chronicle-core" }
chronicle-config = { path = "../crates/chronicle-config" }
chronicle-hooks = { path = "../crates/chronicle-hooks" }
chronicle-ipc = { path = "../crates/chronicle-ipc" }
chronicle-ai = { path = "../crates/chronicle-ai" }
dirs = "6"
chrono = { version = "0.4", features = ["serde", "clock"] }
